[project]
name = "repurpose"
version = "0.1.0"
description = "Turn one source document into multi-channel content that passes an automated quality gate."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
repurpose = "repurpose.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
